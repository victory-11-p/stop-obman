<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e88e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>СТОП-ОБМАН | Защита 24/7</title>
    <!-- Встроенный PWA-манифест и иконка -->
    <link rel="manifest" id="pwa-manifest">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e88e5'/><text x='50' y='68' font-size='55' text-anchor='middle'>🛡️</text></svg>">
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #1a1d20;
            --muted: #5f6672;
            --danger: #e53935;
            --warning: #fb8c00;
            --primary: #1e88e5;
            --success: #2e7d32;
            --border: #e0e4e8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; max-width: 520px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { background: #ffebee; color: var(--danger); font-weight: 700; font-size: 11px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .share-top-btn { background: #e3f2fd; color: var(--primary); border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }

        .header { text-align: center; padding-bottom: 16px; }
        h1 { font-size: 23px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
        .subtitle { font-size: 13.5px; color: var(--muted); }

        /* SOS Блок */
        .sos-box { background: #fff3e0; border: 2px solid var(--warning); border-radius: 16px; padding: 14px; margin-bottom: 12px; text-align: center; }
        .sos-title { font-weight: 700; font-size: 14.5px; color: #e65100; margin-bottom: 8px; }
        .btn-main { display: block; width: 100%; background: var(--warning); color: #fff; text-decoration: none; font-weight: 700; padding: 13px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; text-align: center; }
        .btn-main:active { opacity: 0.9; }
        .sos-edit { font-size: 12px; color: var(--muted); text-decoration: underline; background: none; border: none; margin-top: 6px; cursor: pointer; }

        /* Баннер теста */
        .quiz-banner { background: linear-gradient(135deg, #1e88e5, #1565c0); color: #fff; border-radius: 16px; padding: 15px; margin-bottom: 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 12px rgba(30, 136, 229, 0.25); }
        .quiz-banner h2 { font-size: 15.5px; font-weight: 700; margin-bottom: 2px; }
        .quiz-banner p { font-size: 12px; opacity: 0.9; }

        .section-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.6px; margin: 16px 0 8px 4px; }

        .grid { display: flex; flex-direction: column; gap: 10px; }
        .card-btn { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 13px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .card-btn:active { transform: scale(0.98); }
        .icon { font-size: 25px; flex-shrink: 0; }
        .card-title { font-weight: 700; font-size: 14.5px; color: var(--text); margin-bottom: 2px; line-height: 1.25; }
        .card-desc { font-size: 12px; color: var(--muted); line-height: 1.35; }

        /* Экраны */
        .screen { display: none; animation: fadeIn 0.2s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn { background: none; border: none; color: var(--primary); font-weight: 700; font-size: 15px; padding: 8px 0; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .step-card { background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); margin-bottom: 16px; }
        .screen-title { font-size: 19px; font-weight: 800; margin-bottom: 12px; }
        .alert-banner { background: #ffebee; color: #c62828; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 13.5px; margin-bottom: 16px; border-left: 4px solid var(--danger); }
        .info-banner { background: #e3f2fd; color: #0d47a1; padding: 13px; border-radius: 12px; font-weight: 600; font-size: 13.5px; margin-bottom: 16px; border-left: 4px solid var(--primary); }
        
        .step-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
        .step-item { display: flex; gap: 12px; align-items: flex-start; }
        .step-num { background: var(--primary); color: #fff; font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
        .step-num.danger { background: var(--danger); }
        .step-text strong { display: block; font-size: 14.5px; margin-bottom: 2px; }
        .step-text span { font-size: 13px; color: var(--muted); display: block; }

        .phone-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
        .phone-btn { background: #f1f8e9; color: var(--success); border: 1px solid #c5e1a5; padding: 10px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: 700; font-size: 13px; }

        /* Форма генератора заявлений */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
        .form-control { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #f8f9fa; }
        .doc-output { width: 100%; height: 210px; padding: 12px; border: 1px solid var(--primary); border-radius: 10px; font-size: 12.5px; background: #f0f7ff; margin-top: 12px; font-family: monospace; white-space: pre-wrap; }

        /* Ссылки проверки */
        .ext-link { display: block; padding: 12px; background: #f8f9fa; border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text); margin-bottom: 10px; }
        .ext-link strong { color: var(--primary); display: block; font-size: 14px; }
        .ext-link span { font-size: 12px; color: var(--muted); }

        /* Тест */
        .quiz-q { font-size: 16.5px; font-weight: 700; margin-bottom: 16px; min-height: 52px; }
        .quiz-progress { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
        .quiz-btns { display: flex; flex-direction: column; gap: 10px; }
        .q-btn { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: #f8f9fa; font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; }
        .result-box { padding: 16px; border-radius: 12px; margin-bottom: 16px; }
        .res-high { background: #ffebee; border: 2px solid var(--danger); color: #b71c1c; }
        .res-med { background: #fff3e0; border: 2px solid var(--warning); color: #e65100; }
        .res-low { background: #e8f5e9; border: 2px solid var(--success); color: #1b5e20; }

        .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; padding-bottom: 24px; }
    </style>
</head>
<body>

    <div id="home" class="screen active">
        <div class="top-bar">
            <span class="badge">🛡️ Работает офлайн</span>
            <button class="share-top-btn" onclick="shareApp()">📤 Отправить близким</button>
        </div>

        <div class="header">
            <h1>Стоп-Обман: Защита 24/7</h1>
            <p class="subtitle">Остановитесь на 10 секунд. Выберите ситуацию — мы подскажем безопасный шаг.</p>
        </div>

        <!-- Кнопка звонка близкому -->
        <div class="sos-box">
            <div class="sos-title">🛑 Сомневаетесь? Посоветуйтесь с близким</div>
            <button class="btn-main" id="sosActionBtn" onclick="handleSosClick()">Настроить звонок доверенному лицу</button>
            <button class="sos-edit" id="sosEditBtn" style="display:none;" onclick="setupSosContact()">Изменить контакт</button>
        </div>

        <!-- Интерактивный тест -->
        <div class="quiz-banner" onclick="startQuiz()">
            <div>
                <h2>🔍 Тест: развод или нет? (15 сек)</h2>
                <p>4 вопроса «Да/Нет» для быстрой оценки риска</p>
            </div>
            <div style="font-size:22px;font-weight:700;">→</div>
        </div>

        <div class="section-label">1. Острые ситуации (звонки, коды, ссылки)</div>
        <div class="grid">
            <button class="card-btn" onclick="openScreen('call')">
                <div class="icon">📞</div>
                <div>
                    <div class="card-title">Звонят из Банка / МВД / ФСБ / Госуслуг</div>
                    <div class="card-desc">Пугают кредитом, взломом или требуют «безопасный счет»</div>
                </div>
            </button>

            <button class="card-btn" onclick="openScreen('code')">
                <div class="icon">💬</div>
                <div>
                    <div class="card-title">Просят код из СМС или пуш-уведомления</div>
                    <div class="card-desc">«Курьер», «домофон», «почта», «поликлиника» или «оператор»</div>
                </div>
            </button>
