<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>СТОП-ОБМАН | Защита 24/7</title>
    <link rel="manifest" id="pwa-manifest">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='55' text-anchor='middle'>🛡️</text></svg>">
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --danger: #dc2626;
            --warning: #ea580c;
            --primary: #2563eb;
            --success: #16a34a;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; max-width: 520px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .badge { background: #dcfce7; color: #15803d; font-weight: 700; font-size: 11px; padding: 5px 11px; border-radius: 20px; letter-spacing: 0.3px; }
        .share-top-btn { background: #dbeafe; color: var(--primary); border: none; padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }

        .header { text-align: center; padding-bottom: 18px; }
        h1 { font-size: 25px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; letter-spacing: -0.4px; }
        .subtitle { font-size: 14px; color: var(--muted); }

        .sos-box { background: linear-gradient(135deg, #fff7ed, #ffedd5); border: 1.5px solid #fdba74; border-radius: 18px; padding: 15px; margin-bottom: 14px; text-align: center; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.08); }
        .sos-title { font-weight: 700; font-size: 14.5px; color: #9a3412; margin-bottom: 9px; }
        .btn-main { display: block; width: 100%; background: var(--warning); color: #fff; text-decoration: none; font-weight: 700; padding: 13px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-main:active { transform: scale(0.98); }
        .sos-edit { font-size: 12px; color: #9a3412; text-decoration: underline; background: none; border: none; margin-top: 7px; cursor: pointer; }

        .quiz-banner { background: linear-gradient(135deg, #1d4ed8, #0f172a); color: #fff; border-radius: 18px; padding: 17px; margin-bottom: 18px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 20px rgba(29, 78, 216, 0.25); }
        .quiz-banner:active { transform: scale(0.98); }
        .quiz-banner h2 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
        .quiz-banner p { font-size: 12.5px; opacity: 0.85; }

        .section-label { font-size: 11.5px; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: 0.7px; margin: 20px 0 9px 4px; }

        .grid { display: flex; flex-direction: column; gap: 10px; }
        .card-btn { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04); transition: transform 0.1s, box-shadow 0.1s; }
        .card-btn:active { transform: scale(0.98); }
        .icon-wrap { width: 44px; height: 44px; border-radius: 12px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; border: 1px solid #f1f5f9; }
        .card-title { font-weight: 700; font-size: 15px; color: var(--text); margin-bottom: 2px; line-height: 1.25; }
        .card-desc { font-size: 12.5px; color: var(--muted); line-height: 1.35; }

        .screen { display: none; animation: fadeIn 0.2s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn { background: #fff; border: 1px solid var(--border); color: var(--primary); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 10px; margin-bottom: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .step-card { background: var(--card); border-radius: 18px; padding: 20px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06); margin-bottom: 16px; }
        .screen-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; line-height: 1.25; }
        .alert-banner { background: #fef2f2; color: #b91c1c; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 13.5px; margin-bottom: 16px; border-left: 4px solid var(--danger); }
        .info-banner { background: #eff6ff; color: #1e40af; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 13.5px; margin-bottom: 16px; border-left: 4px solid var(--primary); }
        
        .step-list { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        .step-item { display: flex; gap: 12px; align-items: flex-start; }
        .step-num { background: var(--primary); color: #fff; font-weight: 700; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
        .step-num.danger { background: var(--danger); }
        .step-text strong { display: block; font-size: 14.5px; margin-bottom: 3px; }
        .step-text span { font-size: 13px; color: var(--muted); display: block; }

        .phone-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
        .phone-btn { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; padding: 11px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: 700; font-size: 13px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
        .form-control { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: #f8fafc; }
        .doc-output { width: 100%; height: 220px; padding: 12px; border: 1px solid var(--primary); border-radius: 10px; font-size: 12.5px; background: #eff6ff; margin-top: 12px; font-family: monospace; white-space: pre-wrap; }

        .ext-link { display: block; padding: 13px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text); margin-bottom: 10px; }
        .ext-link strong { color: var(--primary); display: block; font-size: 14px; margin-bottom: 2px; }
        .ext-link span { font-size: 12px; color: var(--muted); display: block; }

        .quiz-q { font-size: 17px; font-weight: 700; margin-bottom: 18px; min-height: 54px; }
        .quiz-progress { font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        .quiz-btns { display: flex; flex-direction: column; gap: 10px; }
        .q-btn { padding: 15px; border-radius: 12px; border: 1.5px solid var(--border); background: #f8fafc; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; }
        .q-btn:active { background: #dbeafe; border-color: var(--primary); }
        .result-box { padding: 16px; border-radius: 14px; margin-bottom: 16px; }
        .res-high { background: #fef2f2; border: 2px solid var(--danger); color: #991b1b; }
        .res-med { background: #fff7ed; border: 2px solid var(--warning); color: #9a3412; }
        .res-low { background: #f0fdf4; border: 2px solid var(--success); color: #166534; }

        .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 28px; padding-bottom: 28px; }
    </style>
</head>
<body>

    <div id="home" class="screen active">
        <div class="top-bar">
            <span class="badge">● Работает офлайн</span>
            <button class="share-top-btn" onclick="shareApp()">📤 Поделиться</button>
        </div>

        <div class="header">
            <h1>Стоп-Обман: Защита 24/7</h1>
            <p class="subtitle">Остановитесь на 10 секунд. Выберите ситуацию — мы подскажем безопасный шаг.</p>
        </div>

        <div class="sos-box">
            <div class="sos-title">🛑 Сомневаетесь? Посоветуйтесь с близким</div>
            <button class="btn-main" id="sosActionBtn" onclick="handleSosClick()">Настроить звонок доверенному лицу</button>
            <button class="sos-edit" id="sosEditBtn" style="display:none;" onclick="setupSosContact()">Изменить контакт</button>
        </div>

        <div class="quiz-banner" onclick="startQuiz()">
            <div>
                <h2>🔍 Тест: развод или нет? (15 сек)</h2>
                <p>4 вопроса «Да/Нет» для быстрой оценки риска</p>
            </div>
            <div style="font-size:22px;font-weight:700;">→</div>
        </div>

        <div class="section-label">1. Острые ситуации (звонки, коды, ссылки)</div>
        <div class="grid">
            <button class="card-btn" onclick="openScreen('call')">
                <div class="icon-wrap">📞</div>
                <div>
                    <div class="card-title">Звонят из Банка / МВД / ФСБ / Госуслуг</div>
                    <div class="card-desc">Пугают кредитом, взломом или требуют «безопасный счет»</div>
                </div>
            </button>
